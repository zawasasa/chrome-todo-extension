<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ささっとeverytodo</title>
    <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
    <div class="header">
        <div class="header-main">
            <h1>ささっとeverytodo</h1>
            <div id="version-display" class="version-display">v1.12</div>
        </div>
        <div id="current-date" class="current-date"></div>
        <div id="progress-display" class="progress-display"></div>
    </div>

    <div class="action-buttons">
        <button id="settings-btn" class="btn btn-secondary">設定</button>
        <button id="calendar-btn" class="btn btn-secondary">📅</button>
        <button id="refresh-btn" class="btn btn-secondary">更新</button>
    </div>


    <!-- Mini Calendar -->
    <div id="mini-calendar" class="mini-calendar" style="display: none;">
        <div class="calendar-header">
            <button id="prev-month" class="calendar-nav">‹</button>
            <span id="calendar-month-year"></span>
            <button id="next-month" class="calendar-nav">›</button>
        </div>
        <div class="calendar-weekdays">
            <div class="weekday">日</div>
            <div class="weekday">月</div>
            <div class="weekday">火</div>
            <div class="weekday">水</div>
            <div class="weekday">木</div>
            <div class="weekday">金</div>
            <div class="weekday">土</div>
        </div>
        <div id="calendar-dates" class="calendar-dates">
            <!-- Calendar dates will be generated here -->
        </div>
        <div id="calendar-preview" class="calendar-preview">
            <h4 id="preview-date">日付を選択してください</h4>

            <!-- Future todo input for selected date -->
            <div id="future-todo-input" class="future-todo-input" style="display: none;">
                <div class="input-section">
                    <input type="text" id="future-todo-text" placeholder="この日のタスクを追加...">
                    <button id="add-future-todo-btn" class="btn btn-primary">追加</button>
                </div>
            </div>

            <div id="preview-tasks">
                <p>選択した日のタスクがここに表示されます</p>
            </div>
        </div>
    </div>

    <div id="task-container" class="task-container" style="display: none;">
        <!-- Today only todo input -->
        <div class="today-todo-section">
            <h3 id="today-todo-title">今日だけのToDo</h3>
            <div class="input-section">
                <input type="text" id="today-todo-input" placeholder="今日だけのタスクを追加...">
                <button id="add-today-todo-btn" class="btn btn-primary">追加</button>
            </div>
        </div>

        <!-- Future todo section -->
        <div class="future-todo-section">
            <h3>未来のやること</h3>
            <div class="future-todo-form">
                <div class="input-section">
                    <input type="text" id="future-task-input" placeholder="未来のタスクを入力...">
                </div>
                <div class="date-section">
                    <label for="future-task-date">実行日:</label>
                    <input type="date" id="future-task-date" class="date-input">
                    <button id="add-future-task-btn" class="btn btn-primary">追加</button>
                </div>
            </div>
        </div>

        <div id="no-tasks" class="no-tasks" style="display: none;">
            <p>📝 今日のタスクはありません</p>
            <p>上の入力欄から今日だけのタスクを追加できます</p>
        </div>

        <ul id="task-list" class="task-list">
            <!-- Tasks will be added here dynamically -->
        </ul>

        <!-- Postpone actions section -->
        <div id="postpone-section" class="postpone-section" style="display: none;">
            <div class="postpone-header">
                <h3>未完了のタスク</h3>
                <p>完了していないタスクがあります。明日に送りますか？</p>
            </div>
            <div class="postpone-actions">
                <button id="postpone-all-btn" class="btn btn-secondary">全て明日に送る</button>
                <button id="mark-done-btn" class="btn btn-primary">今日は完了</button>
            </div>
        </div>
    </div>

    <script src="sidepanel.js"></script>
</body>
</html>
